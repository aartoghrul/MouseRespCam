[project]
name = "surgeryvitals"
version = "0.1.0"
description = "Webcam respiratory-rate monitoring for anaesthetised mice"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "opencv-python-headless", "pyside6-essentials", "pyqtgraph", "matplotlib"]

[project.scripts]
surgeryvitals = "surgeryvitals.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
